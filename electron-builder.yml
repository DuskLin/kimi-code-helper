appId: dev.kimicode.helper
productName: Kimi Code Helper
icon: src/renderer/src/assets/kimi-code-helper-logo.png
artifactName: '${name}-${version}-${os}-${arch}.${ext}'
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
publish:
  provider: github
  owner: DuskLin
  repo: kimi-code-helper
mac:
  identity: '-'
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target:
    - nsis
linux:
  category: Development
  target:
    - AppImage
