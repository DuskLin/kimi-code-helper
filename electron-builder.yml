appId: dev.navo.app
productName: Navo
icon: src/renderer/src/assets/navo-logo.png
artifactName: 'Navo-${version}-${os}-${arch}.${ext}'
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
beforePack: scripts/prepare-cloudflared.cjs
extraResources:
  - from: 'build/cloudflared-bundle/${os}-${arch}'
    to: cloudflared
publish:
  provider: github
  owner: DuskLin
  repo: navo
mac:
  executableName: Navo
  icon: build/icon.icns
  identity: '-'
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
dmg:
  artifactName: 'Navo-${version}-${os}-${arch}.${ext}'
win:
  target:
    - nsis
linux:
  category: Development
  target:
    - AppImage
