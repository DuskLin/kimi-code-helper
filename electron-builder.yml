appId: dev.kimicode.helper
productName: Navo
icon: src/renderer/src/assets/navo-logo.png
artifactName: 'Navo-${version}-${os}-${arch}.${ext}'
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
beforePack: scripts/prepare-cloudflared.cjs
extraResources:
  - from: 'build/cloudflared-bundle/${os}-${arch}'
    to: cloudflared
publish:
  provider: github
  owner: DuskLin
  repo: navo
mac:
  # Preserve the bundle filename required by existing macOS update clients.
  executableName: Kimi Code Helper
  icon: build/icon.icns
  identity: '-'
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Existing installed versions require this exact ZIP name for automatic updates.
  artifactName: 'kimi-code-helper-${version}-${os}-${arch}.${ext}'
dmg:
  artifactName: 'Navo-${version}-${os}-${arch}.${ext}'
win:
  target:
    - nsis
linux:
  category: Development
  target:
    - AppImage
